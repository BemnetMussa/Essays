<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <rect width="900" height="320" fill="#f7f4ef"/>
  <text x="450" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1a1a1a">Foundation model pipeline</text>
  <rect x="40" y="80" width="320" height="180" rx="16" fill="#d9e8f5" stroke="#2f6f9f" stroke-width="2"/>
  <text x="200" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#1a1a1a">1. Pre-training</text>
  <text x="200" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#333">Huge unlabeled data</text>
  <text x="200" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#333">Self-supervised tasks</text>
  <text x="200" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#333">→ general model</text>
  <rect x="540" y="80" width="320" height="180" rx="16" fill="#dcefdc" stroke="#3a7a3a" stroke-width="2"/>
  <text x="700" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#1a1a1a">2. Fine-tuning</text>
  <text x="700" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#333">Smaller labeled data</text>
  <text x="700" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#333">Task-specific training</text>
  <text x="700" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#333">→ specialized model</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#444"/></marker></defs>
  <line x1="380" y1="170" x2="520" y2="170" stroke="#444" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="450" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#444">adapt</text>
</svg>
